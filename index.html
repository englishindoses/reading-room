<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20513d">
  <meta name="description" content="A little reading, at your own pace. Short stories and activities, available offline.">
  <title>Reading Room</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="header" class="app-header"></header>
  <div id="update" role="status"></div>
  <main id="main" tabindex="-1"><p class="loading">Opening your reading room…</p></main>
  <nav id="nav" aria-label="Main navigation"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <noscript>This reading app needs JavaScript to save your progress on this device.</noscript>
  <script type="module" src="./src/app.js"></script>

</html>
